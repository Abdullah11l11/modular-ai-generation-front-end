<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MGF — Modular Generation Framework. Build presentations, dashboards, and sites with AI. Start from a template or generate from a brief."
    />
    <title>MGF — Modular Generation Framework</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of light mode.
      (function () {
        try {
          var stored = localStorage.getItem('mgf.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
